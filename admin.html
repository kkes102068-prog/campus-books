<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>北護校園二手書 後台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="admin-theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-slate-900 text-white">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
      <h1 class="font-bold"><img class="mascot" src="school-emblem.png" alt="北護" width="38" height="38">北護校園二手書 後台</h1>
      <a href="./" class="text-sm text-slate-300 underline">回前台</a>
      <span id="who" class="ml-auto text-sm text-slate-300"></span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-5">
    <div id="gate" class="hidden max-w-md mx-auto bg-white rounded-xl p-6 text-center space-y-3 mt-10"></div>

    <div id="app" class="hidden">
      <nav id="tabs" class="flex gap-1 overflow-x-auto border-b border-slate-300 mb-4"></nav>
      <div id="panel"></div>
    </div>
  </main>

  <!-- 聊天內容 Modal -->
  <div id="modal-chat" class="hidden fixed inset-0 z-40 bg-black/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] flex flex-col">
      <div class="p-4 border-b flex items-center">
        <div class="flex-1 min-w-0"><div id="chat-title" class="font-bold truncate"></div><div id="chat-sub" class="text-xs text-slate-500"></div></div>
        <button id="chat-close" class="text-2xl text-slate-400 leading-none">&times;</button>
      </div>
      <div id="chat-msgs" class="flex-1 overflow-y-auto p-4 space-y-2 bg-slate-50"></div>
      <div class="p-3 border-t flex gap-2 justify-end text-sm" id="chat-actions"></div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 rounded-full bg-slate-800 text-white text-sm px-4 py-2"></div>

  <script src="config.js"></script>
  <script src="departments.js"></script>
  <script src="terms.js"></script>
  <script src="api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
